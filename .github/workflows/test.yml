name: Test standalone bot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - run: go test -race -tags=integration ./...
      - run: go vet ./...
      - run: docker build -t rfd-discord-bot:test .
      - run: docker run --rm -e DISCORD_APP_ID=123 -e DISCORD_BOT_TOKEN=ci-placeholder rfd-discord-bot:test check-config
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v /data rfd-discord-bot:test check-storage
