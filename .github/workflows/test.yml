name: Test Rust bot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LIBSQLITE3_FLAGS: -DHAVE_FDATASYNC=1
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.95.0 fmt --check
      - run: cargo +1.95.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.95.0 test --locked
      - run: cargo +1.95.0 clippy --all-targets --locked --features gcp -- -D warnings
      - run: cargo +1.95.0 test --locked --features gcp
      - run: python3 -m unittest discover -s deploy/gcp -p 'test_*.py'
      - run: docker build --target cloud-run -t rfd-cloud:test .
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges rfd-cloud:test version
      - run: docker build --target runtime -t rfd-discord-bot:test .
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v /data rfd-discord-bot:test check-storage
