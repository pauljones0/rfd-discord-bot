services:
  bot:
    image: ${BOT_IMAGE:-rfd-bot:rust}
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      SQLITE_PATH: /data/rfd.sqlite
      LISTEN_ADDR: 127.0.0.1:8080
      # The small-VM profile runs ordinary alerts with no paid AI calls.
      GEMINI_API_KEY: ""
      GEMINI_MODELS: ""
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - rfd-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /rfd-bot, healthcheck]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  rfd-data:
