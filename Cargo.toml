[package]
name = "rfd-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = []
gcp = ["dep:base64", "dep:flate2", "reqwest/blocking"]

[dependencies]
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
percent-encoding = "2"
httpdate = "1"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "brotli", "cookies", "stream", "query"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup", "cache"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
url = "2"
webpki-roots = "1"

bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

ed25519-dalek = "3.0.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
